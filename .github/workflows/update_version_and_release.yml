name: Version Update and Release

# Workflow Process Flow:
# 1. Trigger Conditions:
#    - Manual execution (workflow_dispatch)
# 2. Environment Setup (Ubuntu, Python, uv, Node.js)
# 3. Retrieve the current version from pyproject.toml and package.json
# 4. Update to the new version:
#    - If 'version' input is set, use it directly (overrides update_type)
#    - Otherwise calculate from 'update_type' (patch/minor/major)
# 5. Commit and push the changes
# 6. Create and push a new tag
# 7. Generate the changelog
# 8. Create a GitHub release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Specific version to set (e.g. 0.1.2). Overrides update_type if provided."
        required: false
        type: string
      update_type:
        description: "Type of version update (used when version is not specified)"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  update-version-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_FOR_PUSHES }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Get current version
        id: current_version
        run: |
          python_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "python_version=${python_version}" >> "$GITHUB_OUTPUT"
          echo "npm_version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Update version
        id: update_version
        run: |
          new_version=$(python - <<'EOF'
          import tomllib, re, sys

          version_input = "${{ github.event.inputs.version }}".strip()
          update_type = "${{ github.event.inputs.update_type }}"

          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)

          version = data['project']['version']

          if version_input:
              if not re.fullmatch(r'\d+\.\d+\.\d+', version_input):
                  print(f"Error: '{version_input}' is not a valid version (expected x.y.z)", file=sys.stderr)
                  sys.exit(1)
              new_version = version_input
          else:
              major, minor, patch = map(int, version.split('.'))
              if update_type == 'patch':
                  patch += 1
              elif update_type == 'minor':
                  minor += 1
                  patch = 0
              elif update_type == 'major':
                  major += 1
                  minor = 0
                  patch = 0
              new_version = f'{major}.{minor}.{patch}'

          with open('pyproject.toml', 'r') as f:
              content = f.read()

          new_content = re.sub(
              r'^(version\s*=\s*")' + re.escape(version) + r'(")',
              r'\g<1>' + new_version + r'\2',
              content,
              count=1,
              flags=re.MULTILINE
          )

          with open('pyproject.toml', 'w') as f:
              f.write(new_content)

          print(new_version)
          EOF
          )
          npm version ${new_version} --no-git-tag-version --no-commit-hooks
          uv sync
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"

      - name: Commit and push if changed
        run: |
          git add pyproject.toml package.json package-lock.json uv.lock
          git commit -m "chore: bump version to ${{ steps.update_version.outputs.new_version }}" || echo "No changes to commit"
          git push

      - name: Create and push new tag
        run: |
          git tag v${{ steps.update_version.outputs.new_version }}
          git push --tags

      - name: Generate changelog
        id: changelog
        run: |
          prev_tag="v${{ steps.current_version.outputs.python_version }}"
          new_tag="v${{ steps.update_version.outputs.new_version }}"
          if git rev-parse "$prev_tag" >/dev/null 2>&1; then
            changelog=$(git log --pretty=format:"- %s" "${prev_tag}..${new_tag}")
          else
            changelog=$(git log --pretty=format:"- %s" "${new_tag}")
          fi
          {
            echo "changelog<<EOF"
            echo "$changelog"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: v${{ steps.update_version.outputs.new_version }}
          name: zensical-macros-utils-v${{ steps.update_version.outputs.new_version }}
          body: |
            ## Changes in this Release

            ${{ steps.changelog.outputs.changelog }}

            For full changes, see the [comparison view](${{ github.server_url }}/${{ github.repository }}/compare/v${{ steps.current_version.outputs.python_version }}..v${{ steps.update_version.outputs.new_version }})
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_FOR_PUSHES }}
