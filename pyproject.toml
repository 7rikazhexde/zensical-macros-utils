[project]
name = "zensical-macros-utils"
version = "0.1.1"
description = "zensical-macros-utils is a zensical-based project that provides macros to extend cards, code blocks, etc, in Zensical documents."
authors = [
    {name = "7rikazhexde", email = "33836132+7rikazhexde@users.noreply.github.com"}
]
license = {text = "MIT"}
readme = "README_PyPI.md"
requires-python = ">=3.10"
dependencies = [
    "zensical>=0.0.41",
    "requests>=2.25.0",
    "jinja2>=3.0.0",
    "pygments>=2.19.1",
]

[project.urls]
homepage = "https://github.com/7rikazhexde/zensical-macros-utils"
repository = "https://github.com/7rikazhexde/zensical-macros-utils"
documentation = "https://7rikazhexde.github.io/zensical-macros-utils/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zensical_macros_utils"]

[dependency-groups]
dev = [
    "pytest>=8.3.4,<10.0.0",
    "mypy>=1.14.1,<3.0.0",
    "ruff>=0.9.4,<0.16.0",
    "pre-commit>=4.1.0",
    "pytest-cov>=6,<8",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.6.1",
    "ruamel-yaml>=0.18.0",
]

# Type checking configuration
[tool.mypy]
files = ["zensical_macros_utils", "tests"]
explicit_package_bases = true
python_version = "3.12"
show_error_context = true
show_column_numbers = true
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
# Ban the explicit `Any` type and bare/implicit-Any generics in the package.
disallow_any_explicit = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["zensical.*","jinja2.*","ruamel.*","pygments.*","yaml.*"]
ignore_missing_imports = true

# The test suite needs Any for its mock framework; keep strictness on the
# production package only.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_any_explicit = false
disallow_any_generics = false

# Coverage configuration
[tool.coverage.run]
omit = ["tests/*", "scripts/*", "docs/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true

# Test configuration
[tool.pytest.ini_options]
testpaths = ["tests/python"]
